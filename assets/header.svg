<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Veysel Alevcan. AI security for industrial systems.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0c1830"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94a3b8" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1280" height="340" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)" mask="url(#dotmask)"/>
    <circle cx="1010" cy="170" r="250" fill="url(#glow)"/>
    <rect x="0" y="336" width="1280" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="22" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>

  <!-- text -->
  <text x="72" y="92" font-size="15" font-weight="600" letter-spacing="3.2" fill="#38bdf8">PHD RESEARCHER · AI SECURITY · LISBON</text>
  <text x="70" y="160" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1">Veysel Alevcan</text>
  <text x="72" y="204" font-size="26" font-weight="500" fill="#cbd5e1">AI security for industrial systems</text>
  <text x="72" y="238" font-size="18" fill="#94a3b8">Detect attacks. Respond safely. Make the AI hard to attack.</text>

  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="72" y="266" width="160" height="36" rx="18" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="152" y="289" fill="#7dd3fc">OT / ICS security</text>
    <rect x="244" y="266" width="176" height="36" rx="18" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="332" y="289" fill="#5eead4">Federated learning</text>
    <rect x="432" y="266" width="128" height="36" rx="18" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="496" y="289" fill="#c4b5fd">AI security</text>
    <rect x="572" y="266" width="148" height="36" rx="18" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.55"/>
    <text x="646" y="289" fill="#fda4af">Agentic AI</text>
  </g>

  <!-- art: protected network around a shield -->
  <g transform="translate(1010,170) scale(0.86)">
    <g fill="none" stroke="#94a3b8">
      <circle r="132" stroke-opacity="0.14" stroke-dasharray="2 6"/>
      <circle r="92" stroke-opacity="0.22"/>
      <circle r="52" stroke-opacity="0.18"/>
    </g>
    <g stroke="url(#accent)" stroke-width="1.6" stroke-opacity="0.7">
      <line x1="0" y1="0" x2="-114" y2="-66"/>
      <line x1="0" y1="0" x2="114" y2="-66"/>
      <line x1="0" y1="0" x2="-114" y2="66"/>
      <line x1="0" y1="0" x2="114" y2="66"/>
      <line x1="0" y1="0" x2="0" y2="-132"/>
      <line x1="0" y1="0" x2="0" y2="132"/>
    </g>
    <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M-114,-66 L0,-132 L114,-66 L114,66 L0,132 L-114,66 Z"/>
    </g>
    <!-- nodes -->
    <g font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.6">
      <g transform="translate(-114,-66)"><circle r="21" fill="#0c1830" stroke="#38bdf8" stroke-width="2"/><text y="4.5" fill="#7dd3fc">PLC</text></g>
      <g transform="translate(114,-66)"><circle r="21" fill="#0c1830" stroke="#2dd4bf" stroke-width="2"/><text y="4.5" fill="#5eead4">HMI</text></g>
      <g transform="translate(-114,66)"><circle r="21" fill="#0c1830" stroke="#2dd4bf" stroke-width="2"/><text y="4.5" fill="#5eead4">FL</text></g>
      <g transform="translate(114,66)"><circle r="21" fill="#0c1830" stroke="#a78bfa" stroke-width="2"/><text y="4.5" fill="#c4b5fd">LLM</text></g>
      <g transform="translate(0,-132)"><circle r="21" fill="#0c1830" stroke="#38bdf8" stroke-width="2"/><text y="4.5" fill="#7dd3fc" font-size="10.5">SCADA</text></g>
      <g transform="translate(0,132)"><circle r="21" fill="#0c1830" stroke="#fb7185" stroke-width="2"/><text y="4.5" fill="#fda4af" font-size="10.5">SHIP</text></g>
    </g>
    <!-- shield -->
    <circle r="44" fill="#070d1a"/>
    <path d="M0,-34 L28,-24 L28,0 Q28,22 0,34 Q-28,22 -28,0 L-28,-24 Z" fill="#38bdf8" fill-opacity="0.12" stroke="url(#shield)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-12,1 L-3,10 L14,-9" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
