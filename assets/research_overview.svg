<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Three research areas and the GRAD-RL pipeline that connects them</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0f203a"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.25" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="0.85" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="760" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="760" fill="url(#bg)"/>
    <rect width="1200" height="760" fill="url(#dots)"/>
    <rect y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="22" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>

  <!-- title -->
  <text x="60" y="72" font-size="14" font-weight="600" letter-spacing="3" fill="#38bdf8">RESEARCH AT A GLANCE</text>
  <text x="60" y="110" font-size="30" font-weight="700" fill="#f8fafc">Safe, private and robust AI for critical infrastructure</text>

  <!-- pillars -->
  <g font-size="16.5" fill="#cbd5e1">
    <!-- OT -->
    <g transform="translate(60,140)">
      <rect width="340" height="272" rx="16" fill="#0b1628" stroke="#38bdf8" stroke-opacity="0.35"/>
      <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#38bdf8"/>
      <g transform="translate(24,26)" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <rect width="40" height="40" rx="10" fill="#38bdf8" fill-opacity="0.12" stroke="none"/>
        <path d="M9,30 L9,18 L16,14 L16,22 L23,18 L23,26 L31,22 L31,30 Z"/>
        <path d="M27,22 L27,10"/>
      </g>
      <text x="78" y="53" font-size="20" font-weight="700" fill="#f8fafc">OT and ICS security</text>
      <g transform="translate(24,104)">
        <circle cx="4" cy="-5" r="3" fill="#38bdf8"/><text x="18">SCADA and PLC anomaly detection</text>
        <circle cx="4" cy="29" r="3" fill="#38bdf8"/><text x="18" y="34">ATT&amp;CK for ICS technique mapping</text>
        <circle cx="4" cy="63" r="3" fill="#38bdf8"/><text x="18" y="68">CVSS 4.0 risk, IEC 62443 safety gate</text>
        <circle cx="4" cy="97" r="3" fill="#38bdf8"/><text x="18" y="102">Digital twins: chemical plant, ship</text>
        <circle cx="4" cy="131" r="3" fill="#38bdf8"/><text x="18" y="136">SWaT, HAI, WADI, GRFICSv3, MaCySTe</text>
      </g>
    </g>
    <!-- AI models -->
    <g transform="translate(430,140)">
      <rect width="340" height="272" rx="16" fill="#0b1628" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#2dd4bf"/>
      <g transform="translate(24,26)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round">
        <rect width="40" height="40" rx="10" fill="#2dd4bf" fill-opacity="0.12" stroke="none"/>
        <circle cx="10" cy="13" r="3"/><circle cx="10" cy="27" r="3"/><circle cx="20" cy="20" r="3"/><circle cx="30" cy="13" r="3"/><circle cx="30" cy="27" r="3"/>
        <path d="M13,14 L17,18 M13,26 L17,22 M23,18 L27,14 M23,22 L27,26"/>
      </g>
      <text x="78" y="53" font-size="20" font-weight="700" fill="#f8fafc">AI models</text>
      <g transform="translate(24,104)">
        <circle cx="4" cy="-5" r="3" fill="#2dd4bf"/><text x="18">Federated learning: data stays on site</text>
        <circle cx="4" cy="29" r="3" fill="#2dd4bf"/><text x="18" y="34">WGAN-GP for rare attack classes</text>
        <circle cx="4" cy="63" r="3" fill="#2dd4bf"/><text x="18" y="68">LSTM autoencoder + XGBoost</text>
        <circle cx="4" cy="97" r="3" fill="#2dd4bf"/><text x="18" y="102">PPO agent, human approval gate</text>
        <circle cx="4" cy="131" r="3" fill="#2dd4bf"/><text x="18" y="136">Explanations for the operator (XAI)</text>
      </g>
    </g>
    <!-- AI security -->
    <g transform="translate(800,140)">
      <rect width="340" height="272" rx="16" fill="#0b1628" stroke="#a78bfa" stroke-opacity="0.35"/>
      <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#a78bfa"/>
      <g transform="translate(24,26)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <rect width="40" height="40" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="none"/>
        <path d="M20,8 L31,12 L31,20 Q31,28 20,32 Q9,28 9,20 L9,12 Z"/>
        <path d="M15,20 L19,24 L26,16"/>
      </g>
      <text x="78" y="53" font-size="20" font-weight="700" fill="#f8fafc">AI security</text>
      <g transform="translate(24,104)">
        <circle cx="4" cy="-5" r="3" fill="#a78bfa"/><text x="18">Adversarial attacks: FGSM, PGD</text>
        <circle cx="4" cy="29" r="3" fill="#a78bfa"/><text x="18" y="34">Adversarial AI Engine stress tests</text>
        <circle cx="4" cy="63" r="3" fill="#a78bfa"/><text x="18" y="68">AI-aware threat modeling</text>
        <circle cx="4" cy="97" r="3" fill="#a78bfa"/><text x="18" y="102">EU AI Act, NIST AI RMF alignment</text>
        <circle cx="4" cy="131" r="3" fill="#a78bfa"/><text x="18" y="136">Resilience index for classifiers</text>
      </g>
    </g>
  </g>

  <!-- pipeline -->
  <text x="60" y="464" font-size="14" font-weight="600" letter-spacing="3" fill="#94a3b8">GRAD-RL · HOW THE PIECES FIT TOGETHER</text>
  <line x1="120" y1="520" x2="1080" y2="520" stroke="url(#flow)" stroke-width="3" stroke-opacity="0.8"/>
  <g text-anchor="middle">
    <g transform="translate(120,520)"><circle r="26" fill="#0b1628" stroke="#94a3b8" stroke-width="2.5"/><text y="6" font-size="16" font-weight="700" fill="#e2e8f0">IN</text>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Telemetry</text><text y="80" font-size="15" fill="#94a3b8">SCADA, PLC, NMEA</text><text y="100" font-size="15" fill="#94a3b8">stays on site</text></g>
    <g transform="translate(312,520)"><circle r="26" fill="#0b1628" stroke="#2dd4bf" stroke-width="2.5"/><text y="6" font-size="16" font-weight="700" fill="#5eead4">1</text>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Detect</text><text y="80" font-size="15" fill="#94a3b8">LSTM autoencoder</text><text y="100" font-size="15" fill="#94a3b8">federated, WGAN-GP</text></g>
    <g transform="translate(504,520)"><circle r="26" fill="#0b1628" stroke="#fbbf24" stroke-width="2.5"/><text y="6" font-size="16" font-weight="700" fill="#fcd34d">2</text>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Name</text><text y="80" font-size="15" fill="#94a3b8">XGBoost maps to a</text><text y="100" font-size="15" fill="#94a3b8">MITRE technique</text></g>
    <g transform="translate(696,520)"><circle r="26" fill="#0b1628" stroke="#a78bfa" stroke-width="2.5"/><text y="6" font-size="16" font-weight="700" fill="#c4b5fd">3</text>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Score</text><text y="80" font-size="15" fill="#94a3b8">CVSS 4.0 graph risk</text><text y="100" font-size="15" fill="#94a3b8">IEC 62443 level</text></g>
    <g transform="translate(888,520)"><circle r="26" fill="#0b1628" stroke="#fb7185" stroke-width="2.5"/><text y="6" font-size="16" font-weight="700" fill="#fda4af">4</text>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Respond</text><text y="80" font-size="15" fill="#94a3b8">PPO agent proposes</text><text y="100" font-size="15" fill="#94a3b8">officer approves SL4</text></g>
    <g transform="translate(1080,520)"><circle r="26" fill="#0b1628" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M8,-6 A10,10 0 1 0 10,3" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/><path d="M4,-11 L9,-6 L3,-2" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="56" font-size="17" font-weight="700" fill="#f8fafc">Stress test</text><text y="80" font-size="15" fill="#94a3b8">adversarial attacks</text><text y="100" font-size="15" fill="#94a3b8">on every stage</text></g>
  </g>

  <!-- stats -->
  <rect x="60" y="652" width="1080" height="80" rx="14" fill="#0b1628" stroke="#94a3b8" stroke-opacity="0.18"/>
  <g text-anchor="middle">
    <g transform="translate(168,0)"><text y="690" font-size="30" font-weight="700" fill="#38bdf8">3</text><text y="716" font-size="14.5" fill="#94a3b8">journal papers (IEEE Access)</text></g>
    <g transform="translate(384,0)"><text y="690" font-size="30" font-weight="700" fill="#2dd4bf">4</text><text y="716" font-size="14.5" fill="#94a3b8">accepted conference papers</text></g>
    <g transform="translate(600,0)"><text y="690" font-size="30" font-weight="700" fill="#fbbf24">2</text><text y="716" font-size="14.5" fill="#94a3b8">public datasets on Zenodo</text></g>
    <g transform="translate(816,0)"><text y="690" font-size="30" font-weight="700" fill="#a78bfa">4</text><text y="716" font-size="14.5" fill="#94a3b8">open research repositories</text></g>
    <g transform="translate(1032,0)"><text y="690" font-size="30" font-weight="700" fill="#fb7185">5</text><text y="716" font-size="14.5" fill="#94a3b8">EU-funded projects</text></g>
  </g>
  <g stroke="#94a3b8" stroke-opacity="0.15"><line x1="276" y1="668" x2="276" y2="716"/><line x1="492" y1="668" x2="492" y2="716"/><line x1="708" y1="668" x2="708" y2="716"/><line x1="924" y1="668" x2="924" y2="716"/></g>
</svg>
